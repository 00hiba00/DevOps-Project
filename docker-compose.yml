services:
  db:
    image: mysql:8
    container_name: bookstore_db
    environment:
      MYSQL_ROOT_PASSWORD: "ALae1900.//.@jsp"
      MYSQL_DATABASE: "book_store"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bookstore_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  app:
    build: .
    container_name: bookstore
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/book_store
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "ALae1900.//.@jsp"
      SERVER_PORT: 9090
    networks:
      - bookstore_network
volumes:
  db_data:
networks:
  bookstore_network:
